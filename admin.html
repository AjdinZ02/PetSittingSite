
<!DOCTYPE html>
<html lang="bs">
<head>
  <meta charset="UTF-8" />
  <title>Admin — Rezervacije | DogWalkingSarajevo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .admin-wrap { width: min(1140px, 92%); margin: 40px auto; }
    .admin-title { font-weight: 800; letter-spacing: .2px; margin-bottom: 8px; color: var(--brand, #d535d0); }
    .admin-error { display:none; margin:12px 0; padding:10px; border-radius:10px; background:#fdecea; color:#b91c1c; font-weight:600; }
    .admin-debug { display:none; padding:10px; background:#f3f4f6; border-radius:10px; overflow:auto; }
    .admin-table { width:100%; border-collapse:collapse; margin-top:12px; background:#fff; border:1px solid rgba(0,0,0,0.08); border-radius:12px; }
    .admin-table thead tr { background:#f3f4f6; }
    .admin-table th, .admin-table td { text-align:left; padding:10px; border-bottom:1px solid rgba(0,0,0,0.06); }
    .admin-table tbody tr:hover { background:#fafafa; }
    .admin-actions { display:flex; gap:8px; align-items:center; }
    .admin-pill { display:inline-block; padding:6px 10px; border-radius:16px; background:#f3f4f6; color:#111; font-size:0.9rem; }
    .status-approved { background:#10b981 !important; color:#fff !important; font-weight:600; }
    .status-pending { background:#f59e0b !important; color:#fff !important; font-weight:600; }
    .status-rejected { background:#ef4444 !important; color:#fff !important; font-weight:600; }
  </style>
</head>
<body>
  <!-- Header / Nav  -->
  <header>
    <div class="navbar container">
      <a href="index.html" class="logo">DogWalkingSarajevo</a>
      <ul class="nav-links" id="navLinks">
        <li><a href="index.html">Početna</a></li>
        <li><a href="reviews.html">Recenzije</a></li>
        <li><a href="reservation.html">Rezervacija</a></li>
        <li><a class="active" href="admin.html">Admin</a></li>
      </ul>
      <button id="hamburger" class="hamburger">☰</button>
    </div>
  </header>

  <main class="admin-wrap">
    <h1 class="admin-title">Rezervacije</h1>

    <!-- Poruka o grešci -->
    <div id="admin-error" class="admin-error">Greška</div>
    <div class="admin-actions" style="margin:10px 0; display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
      <span class="admin-pill" id="admin-user-pill">👤</span>
      <button id="reload-btn" class="btn" type="button">Osvježi</button>
      <button id="show-all-btn" class="btn" type="button" style="background:#6c757d;">Prikaži sve</button>
      <input type="date" id="filter-date" class="btn" style="padding:8px; cursor:pointer;" placeholder="Filtriraj po datumu">
      <span id="filter-label" style="font-size:14px; color:#666;"></span>
    </div>

   

    <!-- Tabela rezervacija -->
    <table class="admin-table">
      <thead>
        <tr>
          <th>Datum</th>
          <th>Početak</th>
          <th>Ime i prezime</th>
          <th>Životinja</th>
          <th>Vrsta</th>
          <th>Adresa</th>
          <th>Telefon</th>
          <th>Napomena</th>
          <th>Parking</th>
          <th>Sa mužjacima</th>
          <th>Sa ženkama</th>
          <th>Povodac</th>
          <th>Bježi</th>
          <th>Strahovi</th>
          <th>Kretanje</th>
          <th>Vakcinisan</th>
          <th>Status</th>
          <th>Akcije</th>
        </tr>
      </thead>
      <tbody id="rezBody">
        <tr><td colspan="18">Učitavanje…</td></tr>
      </tbody>
    </table>
  </main>

  <script src="toast.js"></script>
  <script src="admin.js"></script>
</body>
</html>
