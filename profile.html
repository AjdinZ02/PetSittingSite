<html lang="bs">

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Moj profil</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="auth-page">
  <main class="auth-card">
    <h2>Moj profil</h2>
    <p class="sub">Vaši korisnički podaci</p>
    
    <div id="profileContent" style="margin-top: 24px;">
      <div style="margin-bottom: 20px;">
        <label style="display: block; font-weight: 600; margin-bottom: 8px; color: #555;">Ime i prezime</label>
        <div id="profile-fullname" style="padding: 12px; background: #f5f5f5; border-radius: 8px; color: #333;">-</div>
      </div>

      <div style="margin-bottom: 20px;">
        <label style="display: block; font-weight: 600; margin-bottom: 8px; color: #555;">Korisničko ime</label>
        <div id="profile-username" style="padding: 12px; background: #f5f5f5; border-radius: 8px; color: #333;">-</div>
      </div>

      <div style="margin-bottom: 20px;">
        <label style="display: block; font-weight: 600; margin-bottom: 8px; color: #555;">Email adresa</label>
        <div id="profile-email" style="padding: 12px; background: #f5f5f5; border-radius: 8px; color: #333;">-</div>
      </div>

      <div style="margin-bottom: 20px;">
        <label style="display: block; font-weight: 600; margin-bottom: 8px; color: #555;">Broj telefona</label>
        <div id="profile-phone" style="padding: 12px; background: #f5f5f5; border-radius: 8px; color: #333;">-</div>
      </div>

      <div style="margin-bottom: 20px;">
        <label style="display: block; font-weight: 600; margin-bottom: 8px; color: #555;">Adresa</label>
        <div id="profile-address" style="padding: 12px; background: #f5f5f5; border-radius: 8px; color: #333;">-</div>
      </div>
    </div>

    <div style="margin-top: 24px;">
      <a href="index.html" style="display: inline-block; padding: 12px 24px; background: #d535d0; color: white; text-decoration: none; border-radius: 8px; font-weight: 600;">Nazad na početnu</a>
    </div>
  </main>

  <script src="toast.js" defer></script>
  <script src="profile.js" defer></script>
</body>
</html>
